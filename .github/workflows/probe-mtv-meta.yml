name: Probe MTV numeric metadata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-mtv-meta.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - name: Inspect metadata and scan 2012 cluster
        shell: python
        run: |
          import requests,re,json,html
          from bs4 import BeautifulSoup
          from concurrent.futures import ThreadPoolExecutor,as_completed
          H={'User-Agent':'Mozilla/5.0'}
          def meta(i):
            u=f'https://www.mtvuutiset.fi/makuja/artikkeli/{i}'
            try:
              r=requests.get(u,headers=H,timeout=18)
              if r.status_code!=200:return None
              src=r.text;soup=BeautifulSoup(src,'html.parser')
              def attr(prop,key='property'):
                x=soup.find('meta',attrs={key:prop});return x.get('content','') if x else ''
              title=attr('og:title') or (soup.title.get_text(' ',strip=True) if soup.title else '')
              canon=(soup.find('link',rel='canonical') or {}).get('href','') if soup.find('link',rel='canonical') else ''
              published=attr('article:published_time') or attr('datePublished','itemprop')
              if not published:
                m=re.search(r'\\?"datePublished\\?"\s*:\s*\\?"([^"\\]+)',src); published=m.group(1) if m else ''
              # RSC article title / date snippets
              txt_title=''
              for pat in [r'\\?"headline\\?"\s*:\s*\\?"([^"\\]{3,180})',r'\\?"title\\?"\s*:\s*\\?"([^"\\]{3,180})']:
                m=re.search(pat,src)
                if m: txt_title=html.unescape(m.group(1));break
              return {'id':i,'title':title,'rsc_title':txt_title,'canonical':canon,'published':published,'len':len(src)}
            except Exception:return None
          for i in [6235488,6235624,6235564]:
            x=meta(i);print('KNOWN',json.dumps(x,ensure_ascii=False),flush=True)
          out=[]
          with ThreadPoolExecutor(max_workers=24) as ex:
            fs=[ex.submit(meta,i) for i in range(6235400,6235711,2)]
            for f in as_completed(fs):
              x=f.result()
              if x:out.append(x)
          out.sort(key=lambda x:x['id'])
          for x in out:
            blob=' '.join(str(x.get(k,'')) for k in ['title','rsc_title','canonical','published']).lower()
            if any(k in blob for k in ['2012-02-09','2012-02-16','2012-03-01','09.02.2012','16.02.2012','01.03.2012','vuohen','couscous','sipulikeitto','sienisalaatti']): print('HIT',json.dumps(x,ensure_ascii=False),flush=True)
          open('meta-probe.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: mtv-meta-probe
          path: meta-probe.json
          retention-days: 1

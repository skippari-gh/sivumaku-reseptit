name: Render corrected Sivumaku recipe sources
on:
  push:
    paths:
      - '.github/workflows/render-corrected-recipes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y && npm install playwright
      - run: npx playwright install chromium
      - name: Render corrected pages
        shell: bash
        run: |
          cat > render.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const urls=["https://www.mtvuutiset.fi/makuja/artikkeli/lihapullat-osa-11-pinjansiemenilla-ja-rusinoilla-maustetut-possupyorykat/6235162", "https://www.mtvuutiset.fi/makuja/artikkeli/lihapullat-osa-19-lahi-itamaiset-kibbeh-pullat/6281052", "https://www.mtvuutiset.fi/makuja/artikkeli/lihapullat-osa-28-piripiri-pullat/7397552", "https://www.mtvuutiset.fi/makuja/artikkeli/parmesaanikana/6234920", "https://www.mtvuutiset.fi/makuja/artikkeli/kesamiesten-cajun-maustetut-kanan-koipinuijat-ja-ginger-ale-kastike/6234536", "https://www.mtvuutiset.fi/makuja/artikkeli/kanaa-senagelalaisittain-kookosriisi/6234900", "https://www.mtvuutiset.fi/makuja/artikkeli/kanaleike-minttuisella-hernepyreella/6845556", "https://www.mtvuutiset.fi/makuja/artikkeli/kung-pao-kiinalainen-klassikko-kanasta-maapahkinoista-ja-chilista/7216546", "https://www.mtvuutiset.fi/makuja/artikkeli/taytetyt-sipulit-grossetolaiseen-tapaan/7003258", "https://www.mtvuutiset.fi/makuja/artikkeli/riistapata-linsseilla-ja-rakuunalla/7115028", "https://www.mtvuutiset.fi/makuja/artikkeli/punaviinipaisti-italialaisittain-helppo-ja-huumaava/7267834", "https://www.mtvuutiset.fi/makuja/artikkeli/porsaankyljykset-sinappisella-viinirypalekastikkeella/7287030", "https://www.mtvuutiset.fi/makuja/artikkeli/mainio-moussaka-savotta/6235564", "https://www.mtvuutiset.fi/makuja/artikkeli/sitruunainen-katkarapupasta-chililla-vauhditettuna/6234670", "https://www.mtvuutiset.fi/makuja/artikkeli/gratinoitu-pastavuoka-italialainen-makaronilaatikko/6733700", "https://www.mtvuutiset.fi/makuja/artikkeli/moussaka-yllattavan-helppo-ja-pirun-herkkullinen/7095014", "https://www.mtvuutiset.fi/makuja/artikkeli/vodkapasta/7213758", "https://www.mtvuutiset.fi/makuja/artikkeli/thaityylinen-nuudeliwokki/7341422", "https://www.mtvuutiset.fi/makuja/artikkeli/avoin-lasagne-jokiravunpyrstoilla/7582604", "https://www.mtvuutiset.fi/makuja/artikkeli/ankankoipea-appelsiinikastikkeessa-appelsiinilla-maustetun-risoton-kera/6235338", "https://www.mtvuutiset.fi/makuja/artikkeli/16-risoton-bloggaus/6235344", "https://www.mtvuutiset.fi/makuja/artikkeli/maissi-vehnatortillat/6234870", "https://www.mtvuutiset.fi/makuja/artikkeli/borssikeitto-hirvenlihalla-ja-piparjuurikermalla/6234710", "https://www.mtvuutiset.fi/makuja/artikkeli/feta-mansikat/6234868", "https://www.mtvuutiset.fi/makuja/artikkeli/peperonata-paprikahoysto-kahdella-tapaa/6234968", "https://www.mtvuutiset.fi/makuja/artikkeli/selleripiiras-a-la-gastronaatti/6235288", "https://www.mtvuutiset.fi/makuja/artikkeli/hirven-routapaisti-ja-perunakohokas/6235608", "https://www.mtvuutiset.fi/makuja/artikkeli/tilliliha-traumasta-herkuksi/6235056", "https://www.mtvuutiset.fi/makuja/artikkeli/mutti-kastike-battle/6235250", "https://www.mtvuutiset.fi/makuja/artikkeli/monikayttoinen-munakoisotahna-grillaukseen/6234878", "https://www.mtvuutiset.fi/makuja/artikkeli/eksoottisempi-hot-dog-tomi-bjorckin-tapaan/6234560"];
          const browser=await chromium.launch({headless:true});
          const out={};
          const worker=async(u)=>{
            const page=await browser.newPage();
            try{
              await page.goto(u,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(1800);
              const title=await page.title();
              const text=await page.locator('body').innerText({timeout:15000});
              out[u]={ok:true,title,text};
              console.log('OK',u,text.length);
            }catch(e){out[u]={ok:false,error:String(e)};console.log('ERR',u,String(e));}
            await page.close();
          };
          for(let i=0;i<urls.length;i+=4) await Promise.all(urls.slice(i,i+4).map(worker));
          await browser.close();
          fs.writeFileSync('rendered-corrected.json',JSON.stringify(out,null,2));
          JS
          node render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sivumaku-rendered-corrected
          path: rendered-corrected.json
          retention-days: 1

            "Voinen lime-salviarisotto": "https://www.mtvuutiset.fi/makuja/artikkeli/voinen-salviarisotto-limella/7242032",
            "Ankan koipi ja appelsiinirisotto": "https://www.mtvuutiset.fi/makuja/artikkeli/ankankoipea-appelsiinikastikkeessa-appelsiinilla-maustetun-risoton-kera/6235338",
            "Kantarellirisotto": "https://www.mtvuutiset.fi/makuja/artikkeli/monet-tekevat-yhden-virheen-valmistaessaan-sienirisottoa-ei-todellakaan-kannattaisi/8984974",
            "Kukkakaali-parsarisotto": "https://www.mtvuutiset.fi/makuja/artikkeli/16-risoton-bloggaus/6235344",

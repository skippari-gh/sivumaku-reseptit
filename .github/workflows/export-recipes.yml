            "Avoin lasagne jokiravunpyrstöillä": "https://www.mtvuutiset.fi/makuja/artikkeli/avoin-lasagne-jokiravunpyrstoilla/7582604",
            "Pastaa linsseillä – jumalattoman hyvä ja syvä talviruoka": "https://www.mtvuutiset.fi/makuja/artikkeli/pastaa-linsseilla-jumalattoman-hyva-ja-syva-talviruoka/7633998",

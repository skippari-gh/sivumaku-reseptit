name: Export Sivumaku recipe-only corpus
on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-recipes.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 lxml
      - name: Extract only recipe sections

name: Scan migrated Sivumaku IDs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-mtv.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 lxml
      - shell: python
        run: |
          import requests,re,json
          from bs4 import BeautifulSoup
          from concurrent.futures import ThreadPoolExecutor,as_completed
          ids=list(range(6235480,6235661,2))
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0'})
          def one(i):
              u=f'https://www.mtvuutiset.fi/makuja/artikkeli/x/{i}'
              try:
                  r=s.get(u,timeout=20,allow_redirects=True)
                  if r.status_code!=200 or str(i) not in r.url:return None
                  soup=BeautifulSoup(r.text,'lxml')
                  h=soup.find('h1'); title=h.get_text(' ',strip=True) if h else ''
                  root=soup.select_one('[data-testid="article-text-component"]')
                  body=root.get_text(' ',strip=True)[:500] if root else ''
                  # find publication date in rendered text/metadata
                  txt=soup.get_text(' ',strip=True)
                  m=re.search(r'Julkaistu\s+(\d{1,2}\.\d{1,2}\.\d{4})',txt)
                  date=m.group(1) if m else ''
                  return {'id':i,'url':r.url,'title':title,'date':date,'body':body}
              except Exception as e:return {'id':i,'error':repr(e)}
          out=[]
          with ThreadPoolExecutor(max_workers=16) as ex:
              fs=[ex.submit(one,i) for i in ids]
              for f in as_completed(fs):
                  x=f.result()
                  if x and x.get('title'):out.append(x)
          out.sort(key=lambda x:x['id'])
          for x in out:print(x['id'],'|',x['date'],'|',x['title'],'|',x['url'])
          open('id-scan.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: sivumaku-id-scan
          path: id-scan.json
          retention-days: 1

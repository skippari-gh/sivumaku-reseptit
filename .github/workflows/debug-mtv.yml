name: Inspect MTV recipe source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-mtv.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - shell: python
        run: |
          import requests,re
          u='https://www.mtvuutiset.fi/makuja/artikkeli/pikaruokaa-rakuunakana/6235650'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          print('status',r.status_code,'len',len(r.text),'url',r.url,flush=True)
          open('mtv_raw.html','w',encoding='utf-8').write(r.text)
          hits=[]
          for pat in ['rakuuna','articleBody','6235650','broilerin','crème','__NEXT_DATA__','application/ld+json','content']:
              m=re.search(pat,r.text,re.I)
              if m:hits.append(r.text[max(0,m.start()-1000):m.start()+8000])
          open('mtv_hits.txt','w',encoding='utf-8').write('\n\n===== HIT =====\n\n'.join(hits))
      - uses: actions/upload-artifact@v4
        with:
          name: mtv-source-debug
          path: |
            mtv_raw.html
            mtv_hits.txt
          retention-days: 1

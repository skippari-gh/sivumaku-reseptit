name: Inspect MTV recipe search
on:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-mtv.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm init -y && npm install playwright
      - run: npx playwright install --with-deps chromium
      - shell: bash
        run: |
          cat > search.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const q='Papas Rellenas';
          const u='https://www.mtvuutiset.fi/haku?q='+encodeURIComponent(q);
          await page.goto(u,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(7000);
          const links=await page.locator('a').evaluateAll(as=>as.map(a=>({text:(a.innerText||'').trim(),href:a.href})).filter(x=>x.href.includes('mtvuutiset.fi')));
          console.log(JSON.stringify(links,null,2));
          await page.screenshot({path:'search.png',fullPage:true});
          await browser.close();
          JS
          node search.mjs > search-links.json
          cat search-links.json
      - uses: actions/upload-artifact@v4
        with:
          name: mtv-search-debug
          path: |
            search-links.json
            search.png
          retention-days: 1

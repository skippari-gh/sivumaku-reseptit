name: Render all final Sivumaku sources
on:
  push:
    paths: ['.github/workflows/render-all-final.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm init -y && npm install playwright
      - run: npx playwright install chromium
      - name: Download previous 324 corpus metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh run download 33597051074 -R skippari-gh/sivumaku-reseptit -n sivumaku-324-lopullinen -D prev
          ls -la prev
      - name: Render all final source pages
        shell: bash
        run: |
          cat > render.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const entries=JSON.parse(fs.readFileSync('prev/Sivumaku_324_reseptia_LOPULLINEN.json','utf8'));
          const missing=new Set(['Kermainen sipulikeitto','Vuohenjuusto-punajuuritimbaali','Vuohenjuustokohokas','Marokkolainen couscous','Sienisalaatti','Kanaa kookosriisillä senegalilaisittain','Vodkapasta']);
          const ov={
            'Lihapullat osa 11 – pinjansiemenillä ja rusinoilla maustetut possupyörykät':'https://www.mtvuutiset.fi/makuja/artikkeli/lihapullat-osa-11-pinjansiemenilla-ja-rusinoilla-maustetut-possupyorykat/6235162',
            'Lihapullat osa 19 – Lähi-itämaiset kibbeh-pullat':'https://www.mtvuutiset.fi/makuja/artikkeli/lihapullat-osa-19-lahi-itamaiset-kibbeh-pullat/6281052',
            'Lihapullat osa 28 – Piripiri-pullat':'https://www.mtvuutiset.fi/makuja/artikkeli/lihapullat-osa-28-piripiri-pullat/7397552',
            'Parmesaanikana':'https://www.mtvuutiset.fi/makuja/artikkeli/parmesaanikana/6234920',
            'Cajun-maustetut kanan koipinuijat ja ginger ale -kastike':'https://www.mtvuutiset.fi/makuja/artikkeli/kesamiesten-cajun-maustetut-kanan-koipinuijat-ja-ginger-ale-kastike/6234536',
            'Rapea kanaleike minttuisella hernepyreellä':'https://www.mtvuutiset.fi/makuja/artikkeli/kanaleike-minttuisella-hernepyreella/6845556',
            'Kung Pao – kiinalainen klassikko kanasta, maapähkinöistä ja chilistä':'https://www.mtvuutiset.fi/makuja/artikkeli/kung-pao-kiinalainen-klassikko-kanasta-maapahkinoista-ja-chilista/7216546',
            'Raakamakkaralla täytetyt grillisipulit':'https://www.mtvuutiset.fi/makuja/artikkeli/taytetyt-sipulit-grossetolaiseen-tapaan/7003258',
            'Metsäkauris-linssipata rakuunalla':'https://www.mtvuutiset.fi/makuja/artikkeli/riistapata-linsseilla-ja-rakuunalla/7115028',
            'Punaviinissä haudutettu paisti (hirvi/nauta)':'https://www.mtvuutiset.fi/makuja/artikkeli/punaviinipaisti-italialaisittain-helppo-ja-huumaava/7267834',
            'Porsaankyljykset sinappisella viinirypälekastikkeella':'https://www.mtvuutiset.fi/makuja/artikkeli/porsaankyljykset-sinappisella-viinirypalekastikkeella/7287030',
            'Sitruunainen katkarapupasta chilillä':'https://www.mtvuutiset.fi/makuja/artikkeli/sitruunainen-katkarapupasta-chililla-vauhditettuna/6234670',
            'Gratinoitu pastavuoka – italialainen makaronilaatikko':'https://www.mtvuutiset.fi/makuja/artikkeli/gratinoitu-pastavuoka-italialainen-makaronilaatikko/6733700',
            'Thaityylinen nuudeliwokki':'https://www.mtvuutiset.fi/makuja/artikkeli/keittioni-klassikko-nuudeliwokki/6235552',
            'Avoin lasagne jokiravunpyrstöillä':'https://www.mtvuutiset.fi/makuja/artikkeli/avoin-lasagne-jokiravunpyrstoilla/7582604',
            'Ankan koipi ja appelsiinirisotto':'https://www.mtvuutiset.fi/makuja/artikkeli/ankankoipea-appelsiinikastikkeessa-appelsiinilla-maustetun-risoton-kera/6235338',
            'Kantarellirisotto':'https://www.mtvuutiset.fi/makuja/artikkeli/kantarellirisotto/6235164',
            'Kukkakaali-parsarisotto':'https://www.mtvuutiset.fi/makuja/artikkeli/16-risoton-bloggaus/6235344',
            'Maissi-vehnätortillat':'https://www.mtvuutiset.fi/makuja/artikkeli/maissi-vehnatortillat/6234870',
            'Borssikeitto hirvenlihalla ja piparjuurikermalla':'https://www.mtvuutiset.fi/makuja/artikkeli/borssikeitto-hirvenlihalla-ja-piparjuurikermalla/6234710',
            'Feta-mansikat':'https://www.mtvuutiset.fi/makuja/artikkeli/feta-mansikat/6234868',
            'Peperonata – paprikahöystö kahdella tapaa':'https://www.mtvuutiset.fi/makuja/artikkeli/peperonata-paprikahoysto-kahdella-tapaa/6234968',
            'Selleripiiras':'https://www.mtvuutiset.fi/makuja/artikkeli/selleripiiras-a-la-gastronaatti/6235288',
            'Tillikastike':'https://www.mtvuutiset.fi/makuja/artikkeli/tilliliha-traumasta-herkuksi/6235056',
            'Mutti-tomaattikastike – versio 1':'https://www.mtvuutiset.fi/makuja/artikkeli/mutti-kastike-battle/6235250',
            'Mutti-tomaattikastike – versio 2':'https://www.mtvuutiset.fi/makuja/artikkeli/mutti-kastike-battle/6235250',
            'Avokadotahna':'https://www.mtvuutiset.fi/makuja/artikkeli/eksoottisempi-hot-dog-tomi-bjorckin-tapaan/6234560',
            'Harissamajoneesi':'https://www.mtvuutiset.fi/makuja/artikkeli/eksoottisempi-hot-dog-tomi-bjorckin-tapaan/6234560',
            'Ginger ale -kastike':'https://www.mtvuutiset.fi/makuja/artikkeli/kesamiesten-cajun-maustetut-kanan-koipinuijat-ja-ginger-ale-kastike/6234536',
            'Monikäyttöinen munakoisotahna grillaukseen':'https://www.mtvuutiset.fi/makuja/artikkeli/monikayttoinen-munakoisotahna-grillaukseen/6234878'
          };
          const keyed=(e)=>e.name==='Moussaka' ? `${e.name}|${e.date}` : e.name;
          const sourceFor=(e)=>{
            if(e.name==='Paprikainen risotto sardellilla ja buffalomozzarellalla') return null;
            if(e.name==='Punaviinikastike') return null;
            if(e.name==='Moussaka' && e.date==='12.03.2012') return 'https://www.mtvuutiset.fi/makuja/artikkeli/mainio-moussaka-savotta/6235564';
            if(e.name==='Moussaka' && e.date==='02.10.2018') return 'https://www.mtvuutiset.fi/makuja/artikkeli/moussaka-yllattavan-helppo-ja-pirun-herkullinen/7095014';
            return ov[e.name] || e.resolved_url || e.href || null;
          };
          const todo=entries.map((e,i)=>({i,name:e.name,date:e.date,group:e.group,url:sourceFor(e),missing:missing.has(e.name)}));
          const unique=[...new Set(todo.filter(x=>!x.missing&&x.url).map(x=>x.url))];
          console.log('entries',todo.length,'unique urls',unique.length);
          const browser=await chromium.launch({headless:true});
          const out={}; let next=0;
          async function worker(id){
            while(true){
              const k=next++; if(k>=unique.length) return;
              const u=unique[k]; let got=null;
              for(let attempt=1;attempt<=2;attempt++){
                const p=await browser.newPage();
                try{
                  await p.goto(u,{waitUntil:'domcontentloaded',timeout:45000});
                  if(attempt===1) await p.waitForTimeout(350);
                  const title=await p.title();
                  const text=await p.locator('body').innerText({timeout:12000});
                  got={ok:true,title,finalUrl:p.url(),text};
                  if(text.length>500 && !/Sivua ei löytynyt|Hups, täällä ei ole mitään/i.test(title+' '+text.slice(0,500))) { await p.close(); break; }
                }catch(err){got={ok:false,error:String(err)};}
                await p.close();
              }
              out[u]=got; console.log(k+1,'/',unique.length,got?.ok?'OK':'ERR',got?.title?.slice(0,70)||got?.error,u);
            }
          }
          await Promise.all(Array.from({length:8},(_,i)=>worker(i)));
          await browser.close();
          fs.writeFileSync('rendered-all-final.json',JSON.stringify({todo,pages:out},null,2));
          JS
          node render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sivumaku-rendered-all-final
          path: rendered-all-final.json
          retention-days: 1

name: Probe MTV numeric routes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-mtv-ids.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - name: Probe routes and nearby old Sivumaku IDs
        shell: python
        run: |
          import requests,re,json
          from bs4 import BeautifulSoup
          from concurrent.futures import ThreadPoolExecutor,as_completed
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          test=6235488
          for u in [f'https://www.mtvuutiset.fi/makuja/artikkeli/{test}',f'https://www.mtvuutiset.fi/makuja/artikkeli/x/{test}',f'https://www.mtvuutiset.fi/makuja/artikkeli/alkupaloj/{test}', 'https://www.mtvuutiset.fi/makuja/artikkeli/eksoottisempi-hot-dog-tomi-bjorckin-tapaan/6234560']:
            try:
              r=s.get(u,timeout=20,allow_redirects=True); print('TEST',u,r.status_code,r.url,len(r.text))
            except Exception as e: print('TESTERR',u,repr(e))
          def one(i):
            # numeric-only path: if this resolves, capture title/date
            for u in [f'https://www.mtvuutiset.fi/makuja/artikkeli/{i}',f'https://www.mtvuutiset.fi/makuja/artikkeli/x/{i}']:
              try:
                r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=12,allow_redirects=True)
                if r.status_code==200 and len(r.text)>10000:
                  soup=BeautifulSoup(r.text,'html.parser'); h=soup.find('h1'); title=h.get_text(' ',strip=True) if h else ''
                  txt=soup.get_text(' ',strip=True); m=re.search(r'Julkaistu\s+(\d{1,2}\.\d{1,2}\.\d{4})',txt)
                  if title:return {'id':i,'url':r.url,'title':title,'date':m.group(1) if m else ''}
              except Exception: pass
            return None
          out=[]
          # Known 2012 Sivumaku IDs cluster broadly here.
          ids=range(6235400,6235710)
          with ThreadPoolExecutor(max_workers=32) as ex:
            fs=[ex.submit(one,i) for i in ids]
            for f in as_completed(fs):
              x=f.result()
              if x:out.append(x)
          out.sort(key=lambda x:x['id'])
          for x in out:
            if x['date'] in {'09.02.2012','16.02.2012','01.03.2012'} or any(k in x['title'].lower() for k in ['vuohen','sipuli','sieni','couscous']): print('HIT',json.dumps(x,ensure_ascii=False))
          open('probe.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: mtv-id-probe
          path: probe.json
          retention-days: 1

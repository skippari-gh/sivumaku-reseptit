name: Fetch raw Sivumaku Next strings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-raw-next.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Fetch all reachable article Next strings
        shell: python
        run: |
          import json,re,html,threading,time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import requests
          entries=[]
          for p in sorted(Path('reseptit').glob('data*.js')):
              m=re.search(r'\.concat\((\[.*\])\);?\s*$',p.read_text(encoding='utf-8'),re.S)
              entries += json.loads(m.group(1))
          old=Path('.github/workflows/export-recipes.yml').read_text(encoding='utf-8')
          mm=re.search(r"RESOLVED=json\.loads\(r'''(\{.*?\})'''\)",old,re.S)
          RESOLVED=json.loads(mm.group(1)) if mm else {}
          RESOLVED['Kantarellirisotto']='https://www.mtvuutiset.fi/makuja/artikkeli/16-risoton-bloggaus/6235344'
          CHILD_RE=re.compile(r'\\"children\\":(?:\[)?\\"((?:\\\\.|[^"\\])*)\\"')
          local=threading.local()
          def session():
              if not hasattr(local,'s'):
                  local.s=requests.Session();local.s.headers.update({'User-Agent':'Mozilla/5.0 AppleWebKit/537.36 Chrome/152 Safari/537.36'})
              return local.s
          def url_for(e):
              if e.get('direct') and '/haku?' not in e.get('href',''):return e.get('href','')
              key=e['name']+('@@'+e.get('date_raw','') if e['name']=='Moussaka' else '')
              return RESOLVED.get(key) or RESOLVED.get(e['name']) or ''
          def extract_strings(src):
              out=[]
              for m in CHILD_RE.finditer(src):
                  try:v=json.loads('"'+m.group(1)+'"')
                  except:continue
                  v=html.unescape(v).strip()
                  if v and not v.startswith('$') and (not out or v!=out[-1]):out.append(v)
              return out
          def one(i,e):
              u=url_for(e)
              base={k:e.get(k) for k in ['name','group','subgroup','year','date','date_raw','href','direct','status','id']};base['url']=u
              if not u:return i,{**base,'fetch_status':'NO_SOURCE','strings':[]}
              last=''
              for attempt in range(2):
                  try:
                      r=session().get(u,timeout=25,allow_redirects=True)
                      if r.status_code==200 and len(r.text)>10000:
                          ss=extract_strings(r.text)
                          return i,{**base,'resolved_url':r.url,'fetch_status':'OK' if ss else 'NO_STRINGS','http_status':r.status_code,'html_len':len(r.text),'strings':ss}
                      last=f'HTTP_{r.status_code}_LEN_{len(r.text)}'
                  except Exception as ex:last=type(ex).__name__+': '+str(ex)
                  time.sleep(.5)
              return i,{**base,'fetch_status':'ERROR','error':last,'strings':[]}
          results=[None]*len(entries)
          with ThreadPoolExecutor(max_workers=16) as ex:
              fs=[ex.submit(one,i,e) for i,e in enumerate(entries)]
              done=0
              for f in as_completed(fs):
                  i,r=f.result();results[i]=r;done+=1
                  if done%50==0 or done==len(entries):print('done',done,'fetchOK',sum(x is not None and x.get('fetch_status')=='OK' for x in results),flush=True)
          Path('Sivumaku_324_RAW_NEXT.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          from collections import Counter
          print('FINAL',Counter(x.get('fetch_status') for x in results),flush=True)
          for x in results:
              if x.get('fetch_status')!='OK':print('BAD',x['name'],x.get('date'),x.get('url'),x.get('fetch_status'),x.get('error',''),flush=True)
      - uses: actions/upload-artifact@v4
        with:
          name: sivumaku-324-raw-next
          path: Sivumaku_324_RAW_NEXT.json
          retention-days: 1

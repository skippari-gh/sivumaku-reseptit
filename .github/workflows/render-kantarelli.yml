name: Render Kantarellirisotto
on:
  push:
    paths: ['.github/workflows/render-kantarelli.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm init -y && npm install playwright && npx playwright install chromium
      - run: |
          cat > x.mjs <<'JS'
          import { chromium } from 'playwright'; import fs from 'fs';
          const u='https://www.mtvuutiset.fi/makuja/artikkeli/kantarellirisotto/6235164';
          const b=await chromium.launch({headless:true}); const p=await b.newPage();
          await p.goto(u,{waitUntil:'domcontentloaded',timeout:60000}); await p.waitForTimeout(1800);
          fs.writeFileSync('kantarelli.json',JSON.stringify({url:u,title:await p.title(),text:await p.locator('body').innerText()},null,2));
          await b.close();
          JS
          node x.mjs
      - uses: actions/upload-artifact@v4
        with: {name: sivumaku-kantarelli, path: kantarelli.json, retention-days: 1}

name: Fetch Sivumaku hotdog subrecipes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-hotdog.yml']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Fetch embedded recipe strings
        shell: python
        run: |
          import requests,re,json,html
          u='https://www.mtvuutiset.fi/makuja/artikkeli/eksoottisempi-hot-dog-tomi-bjorckin-tapaan/6234560'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=45);r.raise_for_status()
          pat=re.compile(r'\\"children\\":(?:\[)?\\"((?:\\\\.|[^"\\])*)\\"')
          out=[]
          for m in pat.finditer(r.text):
            try:v=json.loads('"'+m.group(1)+'"')
            except:continue
            v=html.unescape(v).strip()
            if v and (not out or v!=out[-1]):out.append(v)
          open('hotdog.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          for i,v in enumerate(out):
            if any(k in v.lower() for k in ['avokado','harissa','majone','hot dog','hodari']):
              print('MATCH',i,repr(v))
              for j in range(max(0,i-8),min(len(out),i+25)):print(j,repr(out[j]))
      - uses: actions/upload-artifact@v4
        with:
          name: sivumaku-hotdog-raw
          path: hotdog.json
          retention-days: 1

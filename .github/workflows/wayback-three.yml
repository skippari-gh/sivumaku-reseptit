name: Fetch exact Wayback Sivumaku snapshots
on:
  push:
    paths: ['.github/workflows/wayback-three.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: |
          python - <<'PY'
          import requests,json
          urls={
          'senegal':'http://www.mtv.fi/lifestyle/makuja/sivumaku/blogi/kanaa-senagelalaisittain-kookosriisi/6234900',
          'vodka':'http://www.mtv.fi/lifestyle/makuja/sivumaku/blogi/vodkapasta/7213758',
          'thai':'http://www.mtv.fi/lifestyle/makuja/sivumaku/blogi/thaityylinen-nuudeliwokki/7341422'}
          out={}
          for k,u in urls.items():
            try:
              a=requests.get('https://archive.org/wayback/available',params={'url':u},timeout=25).json()
              out[k]={'availability':a}
              c=a.get('archived_snapshots',{}).get('closest',{})
              if c.get('available') and c.get('url'):
                r=requests.get(c['url'],headers={'User-Agent':'Mozilla/5.0'},timeout=35)
                out[k]['snapshot_url']=c['url'];out[k]['status']=r.status_code;out[k]['html']=r.text[:2000000]
            except Exception as e: out[k]={'error':repr(e)}
          open('wayback-three.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({k:{'has':bool(v.get('html')),'snap':v.get('snapshot_url'),'err':v.get('error')} for k,v in out.items()},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: sivumaku-wayback-three, path: wayback-three.json, retention-days: 1}
